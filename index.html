    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHolder = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHolder;
            },
            set: function(val) {
              fetchHolder = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (reason) {
            var code = reason.code || '';
            var msg = reason.message || (typeof reason === 'string' ? reason : '');
            if (
              code === 'auth/popup-closed-by-user' ||
              code === 'auth/cancelled-popup-request' ||
              code === 'auth/popup-blocked' ||
              msg.indexOf('popup-closed-by-user') !== -1 ||
              msg.indexOf('cancelled-popup-request') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
      })();
    </script>
